name: Provider health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe providers
        id: probe
        run: |
          set +e
          node .github/scripts/provider-health.mjs | tee probe-report.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open issue on failure
        if: steps.probe.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat probe-report.txt)
          gh issue create \
            --title "Provider health check failed ($(date -u +%F))" \
            --label "provider-health" \
            --body "$BODY" || true
