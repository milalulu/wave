name: Release

on:
  push:
    tags: ["v*"]

env:
  NODE_VERSION: 24

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # Подпись апдейт-артефактов (ключ — из `tauri signer generate`).
      # Apple-секреты сюда не выносим: пустая APPLE_CERTIFICATE ломает tauri.
      # WIN_* в env безопасно (tauri их не читает) и нужно для шага импорта
      # сертификата — в step-if контекст `secrets` недоступен.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
      WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libxdo-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Import Windows certificate
        if: env.WIN_CERTIFICATE != ''
        shell: pwsh
        env:
          WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WIN_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WIN_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Wave ${{ github.ref_name }}"
          releaseBody: "Подробности: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          # Манифест автообновлений (latest.json) генерируем только при заданном ключе подписи.
          uploadUpdaterJson: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('src-tauri/gen/android/**/*.kts') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/keystore.p12
            printf 'password=%s\nkeyAlias=upload\nstoreFile=keystore.p12\n' \
              "$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
          fi

      - name: Build and upload APK
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          tagName: ${{ github.ref_name }}
          releaseName: "Wave ${{ github.ref_name }}"
          releaseBody: "Подробности: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: build --apk --target aarch64 armv7

      - name: Verify APK signatures
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found under $SDK"; exit 1; }
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              echo "== verifying $(basename "$apk")"
              "$APKSIGNER" verify --verbose --print-certs "$apk"
            done

      # Гарантированно публикуем APK в релиз со стабильными именами.
      # Секреты не нужны: без keystore.properties сборка подписывается debug-ключом
      # (см. signingConfig в build.gradle.kts) и APK можно скачивать и ставить.
      - name: Upload APKs with stable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          cd src-tauri/gen/android/app/build/outputs/apk
          for apk in $(find . -name '*.apk'); do
            case "$apk" in
              *arm64*) name="wave-android-arm64.apk" ;;
              *armeabi*) name="wave-android-armv7.apk" ;;
              *) name="wave-android-$(basename "$apk")" ;;
            esac
            cp "$apk" "$name"
            gh release upload "${{ github.ref_name }}" "$name" --clobber
            echo "uploaded $name"
          done

  macos-publish:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Подпись Developer ID + нотаризация. Если секреты не заданы —
      # сборка пропускается (см. guard на шаге), чтобы пустые значения не ломали tauri.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release (signed + notarized)
        if: env.APPLE_CERTIFICATE != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Wave ${{ github.ref_name }}"
          releaseBody: "Подробности: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: --target universal-apple-darwin
