name: Android matrix smoke

# Прогон debug-APK на зоопарке API (minSdk 24 → target 36):
# установка, запуск, отсутствие падений, скриншот на артефакты.
on:
  schedule:
    - cron: "42 4 * * 0"
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Select Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          else
            echo "cargo-ndk already installed, skipping"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build x86_64 debug APK
        run: pnpm tauri android build --apk --debug --target x86_64

      - name: Collect APK
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" matrix-app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-apk
          path: matrix-app.apk
          retention-days: 3

  smoke:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 33, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: matrix-apk

      - name: Run smoke on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: bash scripts/android-smoke.sh matrix-app.apk "${{ matrix.api-level }}"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-api${{ matrix.api-level }}
          path: |
            boot-api${{ matrix.api-level }}.png
            boot-api${{ matrix.api-level }}.log
            boot-api${{ matrix.api-level }}-crash.log
          retention-days: 7
