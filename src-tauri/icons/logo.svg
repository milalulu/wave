<?xml version="1.0" encoding="UTF-8"?>
<!--
  Единый логотип Wave: «волна» из баров (перекликается со спектр-визуализатором)
  на градиенте accent #7c5cff → accent-2 #4cc9f0.
  Источник истины для src-tauri/icons/*: при изменении пересобрать
    rsvg-convert -w 1024 -h 1024 logo.svg -o icon-1024.png
    npx tauri icon icon-1024.png
  UI-марка: те же бары в 24-единичном пространстве (src/ui/icons.tsx, WaveIcon).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wave-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#wave-bg)"/>
  <!-- Волна: бары (24-единичная сетка, центрирована в 1024) -->
  <g fill="#ffffff" transform="translate(512 512) scale(42.5) translate(-12.35 -11.5)">
    <rect x="3.1" y="16" width="1.7" height="5" rx="0.85"/>
    <rect x="5.9" y="12" width="1.7" height="9" rx="0.85"/>
    <rect x="8.7" y="7" width="1.7" height="14" rx="0.85"/>
    <rect x="11.5" y="2" width="1.7" height="19" rx="0.85"/>
    <rect x="14.3" y="7" width="1.7" height="14" rx="0.85"/>
    <rect x="17.1" y="12" width="1.7" height="9" rx="0.85"/>
    <rect x="19.9" y="16" width="1.7" height="5" rx="0.85"/>
  </g>
</svg>
